# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build KCC for Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

    # Don't trigger if it's just a documentation update
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '**.yml'
      - '**.sh'
      - 'docs/**'
      - 'Dockerfile'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
      - '.dockerignore'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.11
        cache: 'pip'
    - name: Install python dependencies
      run: |
        sudo apt-get update 
        sudo apt-get install -y libpng-dev libjpeg-dev p7zip-full p7zip-rar python3-pip squashfs-tools libxcb-cursor0
        python -m pip install --upgrade pip certifi pyinstaller --no-binary pyinstaller 
        python -m pip install -r requirements.txt
    - name: build binary
      run: |
        python setup.py build_binary
        chmod +x dist/kcc_linux*
    - name: Build AppImage
      run: |
        set -eux
        ARCH="$(uname -m)"
        SHARUN="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh"

        # Configure the AppImage
        export ICON=icons/comic2ebook.png
        export DESKTOP=/usr/share/applications/kcc_linux.desktop
        export OUTPATH=./dist
        export OUTNAME=kcc_linux-"$ARCH".AppImage

        # Download and run quick-sharun
        wget "$SHARUN" -O ./quick-sharun
        chmod +x ./quick-sharun

        # Bundle the application
        ./quick-sharun /usr/bin/myapp

        # Create the AppImage
        ./quick-sharun --make-appimage
      env:
        UPDATE_INFO: gh-releases-zsync|ciromattia|kcc|latest|*x86_64.AppImage.zsync
    - name: upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: AppImage
        path: './*.AppImage*'
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        prerelease: true
        generate_release_notes: false
        files: |
          LICENSE.txt
          *.AppImage*
